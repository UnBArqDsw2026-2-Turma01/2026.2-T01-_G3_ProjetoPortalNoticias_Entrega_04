name: Deploy GitHub Pages (MkDocs + Portal)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build documentation
        run: mkdocs build --strict

      # ---------- Portal Next.js (publicado em /portal) ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install portal dependencies
        working-directory: portal
        run: npm ci
      - name: Test portal
        working-directory: portal
        run: npm test
      - name: Build portal
        working-directory: portal
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/portal
        run: npm run build
      - name: Copy portal into the site
        run: cp -r portal/out site/portal

      # ---------- Storybook (publicado em /storybook) ----------
      - name: Build Storybook
        working-directory: portal
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/storybook
        run: npm run build-storybook -- -o ../site/storybook

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

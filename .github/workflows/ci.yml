name: CI do Portal

# Roda em todo Pull Request que mexe no portal: só faz merge com este check verde.
on:
  pull_request:
    paths:
      - "portal/**"
      - ".github/workflows/**"

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (export estático)
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/portal
        run: npm run build
